<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // Pre-paint theme resolution to avoid a flash of the wrong theme.
      // Mirrors readAppearance/resolveAppearance in src/ui/model.ts.
      try {
        const stored = localStorage.getItem("appearance");
        const legacy = localStorage.getItem("dark-mode");
        const preference = ["light", "dark", "system"].includes(stored)
          ? stored
          : legacy === "true"
            ? "dark"
            : legacy === "false"
              ? "light"
              : "system";
        const theme =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#202327"
      media="(prefers-color-scheme: dark)"
    />
