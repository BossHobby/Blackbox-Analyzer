name: build
on:
  push:
    branches:
      - "master"
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: setup rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/
            ~/.cargo/git/
            @cargo/analysis/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('@cargo/analysis/Cargo.toml') }}

      - name: install cargo packages
        run: |
          command -v wasm-pack || cargo install --locked wasm-pack
          command -v rsw || cargo install --locked rsw

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: install npm packages
        run: npm ci

      - name: test analysis crate
        run: cargo test --manifest-path @cargo/analysis/Cargo.toml

      - name: test
        run: npm test

      - name: build gh-pages
        run: |
          npm run build:gh-pages

      # Needs the wasm package the build generates.
      - name: type-check
        run: npm run type-check

      - name: upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: gh-pages
          path: docs

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: checkout gh-pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git pull
          git checkout gh-pages

      - uses: actions/download-artifact@v8
        with:
          name: gh-pages

      - name: update gh-pages
        run: |
          git add .
          git commit -m "GitHub Pages $GITHUB_SHA" || exit 0
          git remote set-url --push origin https://actions:$GITHUB_TOKEN@github.com/BossHobby/Blackbox-Analyzer
          git push -f
